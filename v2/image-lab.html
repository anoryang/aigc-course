<script>
const prompts=[{"tab": "旅行地理杂志", "title": "旅行地理杂志", "description": "保留照片，叠加地图与地理标记。", "kind": "原文 · 用户提供的截图", "text": "/ 请帮我把这张旅行摄影作品制作成一张具有独立杂志（Editorial Photography / Travel Zine）风格的地理视觉作品。\n\n拍摄地点：【填写城市、景点或 GPS 坐标】\n\n核心要求：\n\n1. 尽可能完整保留原始照片，不重新创作人物、建筑、山体、天空，不改变原有色彩和光影。\n2. 根据拍摄地点，添加具有真实地理特征的地图元素，例如海岸线、城市街道、山脉地形、等高线或步道。\n3. 地图采用透明 PNG 图层叠加的视觉效果，避免传统方形地图卡片。\n4. 地图优先放在天空、海面或其他负空间，不遮挡摄影主体。\n5. 地图占画面约 15%-25%，可以根据构图自由调整。\n6. 使用细线条、低饱和度配色、少量英文地名和精致的地理标记。", "guide": "上传原图后填写拍摄地点。示例图的地名及坐标未核实。", "source": "来源：用户提供的 siyuhuh 笔记截图", "image": "travel-zine-v1.png"}, {"tab": "粗糙实体浮雕", "title": "粗糙实体浮雕", "description": "上半部保留摄影，下半部重构为有颗粒与厚度的实体浮雕。", "kind": "原文 · 摄绘人", "text": "【画幅与结构】\n制作一张竖向 3:4 的上下对比旅行转绘海报。\n\t\n【上半部 · 约 40%–50% · 保留照片】\n保留输入照片本身：保留主体数量、人物或动物姿势、道路/建筑/视线结构、观察角度、光线和自然色彩，只做一点出版级调色。\n不要把照片画成插画，不要替换地标或改变人物。\n\t\n【下半部 · 重构为实体浮雕】\n将同一场景重构为可触摸的粗糙实体浮雕，不复制完整照片取景。\n把关键建筑、道路、护栏、山脊、树冠、桌面或器物压缩为有厚度的分层块体，改变主体坐标、裁切和信息密度。\n\t\n【底材与手感】\n底材为剖面景观墙、石膏板、纸浆板或手工水泥地形，须有颗粒、铲痕、压痕、缝隙、崩边、密度和接触遮挡。\n\t\n【叙事性元素缺口】\n只从照片中选择一个有叙述性的元素缺口，如海水、雨水、烟草、树根、藤蔓、道路边线、织物或建筑框架；保留从浮雕塔、孔洞底或边延伸约 5%–20% 的画幅，并具备真实材质的投影、反光、颗粒或纤维。\n【色彩】\n色彩输入照片并压缩为 3–7 种哑光矿物色。\n【文字与留白】\n下半保留从连续信息空场，并嵌入 RELIEF、RELIEF STUDY 01、ONE MATERIAL ESCAPES THE SCENE。\n【禁止项】\n不要拼贴、网格、马赛克、珠片、平滑塑料 3D、数码故障、Logo、水印、原图或 AI 图角。", "guide": "上传同一张原图，将完整原文粘贴至支持图像编辑的工具。", "source": "来源：摄绘人《照片转粗糙实体浮雕海报｜附提示词》", "url": "https://www.xiaohongshu.com/discovery/item/6ab32db100000000020121a6", "image": "relief-v1.png"}, {"tab": "超现实绘本", "title": "超现实摄影与手绘绘本", "description": "让真实摄影自然延伸到米白纸张上的童话插画。", "kind": "原文 · 阳仓｜王可爱", "text": "竖版3:4，超现实editorial艺术海报，将上传参考图片的真实摄影物件/场景，和童话感手绘插画世界自然融合。\n画面上半部分：高度真实摄影质感，严格保留原图的主体、构图、色彩、材质纹理、识别细节；保留自然光线、真实材质、合理阴影、反光质感、景深，细腻可信的摄影细节，不替换原图主体，不改动原图视觉重点。\n从原图识别一个可延展元素（液体/纹理/路径/物体边缘），该元素向下自然流动、垂落、延伸，平滑变形，逐步过渡转化为下方插画世界，作为连接真实与幻想的载体。\n下半插画区域：米白色纸张背景，细腻黑色墨线+铅笔线稿，轻柔水彩与水粉质感，带有手工绘制的不完美边缘，低饱和复古配色，旧故事书绘本插图气质。可适度添加少量精致微型细节（微型小人、小植物、石块、小路等），元素和原图主题呼应，不堆砌，画面不拥挤。\n插画区域内放置一句简短手写英文短句，手写字体带有轻微不完美质感，字号小巧，巧妙融入画面，不喧宾夺主。\n整张画面是连续完整视觉叙事，没有生硬横向分割线，不加边框、相框、箭头、标签、标题栏。摄影部分与插画部分无缝流畅过渡，视觉效果：从真实世界缓缓进入想象世界。\n整体气质：诗意、童趣、巧妙、极简高级editorial艺术感，超现实但视觉可信，带有纸张触感与轻微手工瑕疵，保留适当留白，焦点明确，细节丰富但不杂乱。", "guide": "上传同一张原图。此处保留作者的全部提示词，未改写措辞或修正文字。", "source": "来源：阳仓｜王可爱《超现实editorial艺术海报》", "url": "https://www.xiaohongshu.com/explore/6abb634d0000000015006996", "image": "surreal-v1.png"}, {"tab": "九宫格手绘", "title": "九宫格手绘记忆海报", "description": "上半部保留真实照片，下半部将场景记忆重构为 9 个手绘图标。", "kind": "原文 · 哈哈哈的五哈", "text": "请将我上传的每一张照片分别制作成一张独立的高级设计海报，不多图拼接，每张照片单独输出。整体采用3:4竖版构图，上下两个区域高度严格1:1，各占画面50%。 上半部分保留原始照片，保持主体身份、结构、姿态、真实质感、自然光影和原有色彩氛围，仅进行轻微高级调色，使其具有艺术杂志、独立出版物与展览图像质感。为适配画幅，可自然扩展环境背景，但不得拉伸、扭曲或改变主体。 下半部分提取照片中最具识别性的**主体、局部元素、动作线索、物件细节与叙事关系**，重构为一套 **3×3 模块化图标网格 + 手绘稚拙涂鸦插画 + 蜡笔/彩铅颗粒质感 + 手写文字** 的视觉系统。不要完整描摹原图，也不要做写实插画，而是将复杂信息压缩为 9 个最值得被记住的视觉单元：可以是主体本身、局部特征、随身物件、植物、食物、交通方式、姿态、情绪符号或场景中的小记忆点。每个单元都应来自上方同一画面的语义延伸，使人一眼感到它们属于同一张照片的“记忆清单”。 构图采用**隐性的 3×3 松散网格**。九宫格只作为底层秩序，不必画得过于工整；每个图标的位置、大小、角度和落点都可轻微偏移，形成既有秩序又不机械的 **loose grid / organic grid** 感。顶部可加入一个简短手写标题，并配少量轻松的小波浪线、星点或符号；底部可加入一句极小的手写 caption，使整体像一页私人手帐、视觉日记或 collection sheet。留白必须充足，版面要松弛、可爱、克制而不凌乱。 画风采用**Naïve Hand-drawn Doodle Illustration**：形体简洁、略带稚拙感，轮廓轻微抖动、粗细不均、不完全闭合，保留有意识的不完美。填色不要铺得太满，允许看到纸纹、白色颗粒和边缘毛糙感。可混合黑色细线轮廓、彩铅/蜡笔填色和少量局部色块，不依赖真实光影塑造，而以 flat color / spot color 的方式建立图形关系。网格辅助线若出现，应极淡，像铅笔轻轻打出的底稿，而不是电脑绘制的规则表格。", "guide": "上传原图，粘贴完整原文。生成结果是风格参考，可对照原图检查细节。", "source": "来源：哈哈哈的五哈《超级喜欢的提示词！》", "url": "https://xhslink.cn/o/4wbwpFFvwMb", "image": "doodle-v1.png"}, {"tab": "实景旅行线稿", "title": "实景旅行线稿", "description": "摄影与极简钢笔小人物：让照片底部的结构延伸进入象牙白留白。", "kind": "原文 · 用户直接提供", "text": "整张海报采用严谨的上下二分构图：上半部分（约占画面顶部50%）必须以最高保真度完整保留原照片。照片中的主体人物、建筑轮廓、自然景致、真实光影、环境色调及原有构图细节均需保持真实质感，严禁对照片进行风格重绘、局部虚化、畸变拉伸、镜像翻转或随意拼贴，仅允许为了适配2:3画幅做微小的同比例安全边缘裁剪或自然延展。画面过渡与核心连接机制：请智能识别上半部分照片底部最顺畅的一处线性或结构元素，如公路边缘、斑马线、海浪潮位线、游船系泊绳、电缆、林木枝条、台阶、栏杆或水面倒影。选定该元素后，让它在画面中央水平分界处形成精准锚点，自照片原本位置顺滑穿越分界线，并自然过渡褪变为简洁克制的纯黑色钢笔线条，向下延展进入空白区域。照片真实结构与手绘线稿之间必须完全严丝合缝、物理连贯，不可中途错位、突兀断笔或凭空另起一条独立线段。下半部分（约占画面底部50%）视觉规范：底色设为纯净通透的暖象牙白（Warm Ivory），仅附带极为细腻内敛的棉麻细纤维艺术纸肌理，保持大面积留白与呼吸感。画面中设计一位高度仅占全图7%至10%的极简黑色钢笔单线小人物。该人物必须与上方延伸下来的黑色线稿形成生动、合理的物理交互，例如：坐在延伸的线条上垂足发呆、单手牵拉线稿往前漫步、俯身攀爬该线条、倚靠其上阅读或仰头驻足凝望。人物衣着为松弛轻简的便服轮廓，线条轻盈微带手绘抖动感，舍弃复杂五官刻画，严禁出现厚重描边、日漫萌系Q版、粗糙草稿杂线或漂浮脱节状态。排版与文字细节：在下半部分留白区域的适宜角落（如右下角），排版一行由2至4个英文单词组成的极小字号浅灰手写体情绪短句（例如“quiet breeze”或“traces of time”），字迹清秀纤细，仅作为轻量级诗意旁白，严禁使用粗黑主标题排版。整幅海报呈现出高级杂志编辑排版、克制诗意与精妙视觉隐喻相结合的当代画廊质感。全图严禁出现边框装裱、邮票锯齿、网格拼图、水印字迹、手机UI、粗重轮廓、繁复装饰图标以及暗沉发黄的泛黄纸底。", "guide": "使用同一张原图和原文生成。此结果的连接线存在断续，作为实际输出保留，未视为严格满足连续线条要求。", "source": "来源：用户在本次对话直接提供的提示词原文", "image": "lineart-v1.png"}, {"tab": "第二世界", "title": "第二世界 · 摄影二创", "description": "从原照片的结构出发，让海湾与夕阳化作延伸进纸面的另一片空间。", "kind": "原文 · 用户直接提供", "text": "请基于我上传的摄影作品，制作一张3:4竖版的「第二世界」摄影二创海报。整体严格上下 1:1：上半部分尽可能忠实保留原照片，不改变主体、人物动作、空间关系、色彩和自然光影，只做必要的等比裁切。下半部分使用自然的暖米白纸张背景，保留大量留白。但不要直接套用“撕纸＋小人”的固定模板。生成之前，请先认真观察这张照片：1.找出照片里最有辨识度的视觉结构，而不只是识别题材。例如水波、道路、倒影、云层、枝条、光束、影子、建筑边缘、人物动作、山脊等。2.问自己：\n“如果照片里的这个结构真的变成一种可以被触碰、使用或改变的东西，它最自然会是什么？\"由此找到只属于这张照片的“第二世界”。可能发生的变化包括但不限于：拉、推、拨开、进入、打捞、测量、修补、展开、铺平、攀爬、连接、收集.⋯⋯•但不要机械复用这些动作。3.摄影剪贴的形状本身也必须参与解释照片。不要默认使用普通不规则撕纸边。水可以成为一块小水域，光可以成为某种可被借用的东西，道路可以继续延伸，云或树枝也可能形成新的空间关系。具体答案必须从这一张照片本身产生。", "guide": "上传原照片并粘贴原文。示例图中的文字与水域形状由模型生成。", "source": "来源：用户在本次对话直接提供的提示词原文", "image": "second-world-v1.png"}];
const el=id=>document.getElementById(id);
document.querySelectorAll('[data-prompt]').forEach(button=>button.addEventListener('click',async()=>{const entry=prompts[Number(button.dataset.prompt)];const text=entry.text;try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(text);el('resultStatus').textContent='已复制：'+entry.tab+'（原文提示词）';}catch{const box=el('resultManualCopy');box.hidden=false;box.value=text;box.focus();box.select();el('resultStatus').textContent='原文已全选，请按 Ctrl+C（Mac：⌘C）复制。'}}));
</script>
</body></html>
